[project]
name = "soundmonkey"
version = "0.1.0"
description = "Priority-based automatic audio device switching for Omarchy, driven by live headset/earbud presence."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "hedgemonkey" }]
dependencies = [
    "pyyaml>=6.0",
    "hid>=1.0.5",
]

[project.scripts]
soundmonkey = "soundmonkey.daemon:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soundmonkey"]
